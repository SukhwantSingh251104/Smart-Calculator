<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ==============================
         MAIN CALCULATOR CONTAINER
         ============================== -->

    <main class="calculator">

        <!-- Calculator Heading -->

        <div class="calculator-header">

            <h1>Smart Calculator</h1>

            <p>Simple • Fast • Accurate</p>

        </div>


        <!-- ==============================
             DISPLAY SCREEN
             ============================== -->

        <div class="display-container">

            <!-- Previous calculation -->

            <div id="previous-display"
                 class="previous-display">
            </div>

            <!-- Current number -->

            <div id="current-display"
                 class="current-display">
                0
            </div>

        </div>


        <!-- ==============================
             CALCULATOR BUTTONS
             ============================== -->

        <div class="buttons">


            <!-- Row 1 -->

            <button
                class="button clear"
                id="clear-button"
                type="button">

                C

            </button>


            <button
                class="button operator"
                data-action="backspace"
                type="button">

                ⌫

            </button>


            <button
                class="button operator"
                data-action="percentage"
                type="button">

                %

            </button>


            <button
                class="button operator"
                data-operation="divide"
                type="button">

                ÷

            </button>



            <!-- Row 2 -->

            <button
                class="button number"
                data-number="7"
                type="button">

                7

            </button>


            <button
                class="button number"
                data-number="8"
                type="button">

                8

            </button>


            <button
                class="button number"
                data-number="9"
                type="button">

                9

            </button>


            <button
                class="button operator"
                data-operation="multiply"
                type="button">

                ×

            </button>



            <!-- Row 3 -->

            <button
                class="button number"
                data-number="4"
                type="button">

                4

            </button>


            <button
                class="button number"
                data-number="5"
                type="button">

                5

            </button>


            <button
                class="button number"
                data-number="6"
                type="button">

                6

            </button>


            <button
                class="button operator"
                data-operation="subtract"
                type="button">

                −

            </button>



            <!-- Row 4 -->

            <button
                class="button number"
                data-number="1"
                type="button">

                1

            </button>


            <button
                class="button number"
                data-number="2"
                type="button">

                2

            </button>


            <button
                class="button number"
                data-number="3"
                type="button">

                3

            </button>


            <button
                class="button operator"
                data-operation="add"
                type="button">

                +

            </button>



            <!-- Row 5 -->

            <button
                class="button number zero"
                data-number="0"
                type="button">

                0

            </button>


            <button
                class="button number"
                data-number="."
                type="button">

                .

            </button>


            <button
                class="button equals"
                id="equals-button"
                type="button">

                =

            </button>


        </div>


        <!-- ==============================
             KEYBOARD INFORMATION
             ============================== -->

        <div class="keyboard-info">

            <p>
                💡 You can also use your keyboard
            </p>

        </div>

    </main>


    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
